name: 'lx: Latest Package Tool'
description: 'Build Debian packages from upstream releases for multiple architectures'
author: 'ranjithrajv'

branding:
  icon: 'package'
  color: 'red'

inputs:
  config-file:
    description: 'Path to the package.yaml configuration file'
    required: true
  version:
    description: 'Version of the software to build'
    required: true
  build-version:
    description: 'Debian build version number'
    required: true
  architecture:
    description: 'Architecture to build (amd64, arm64, armel, armhf, i386, ppc64el, s390x, riscv64, loong64, or "all")'
    required: false
    default: 'all'
  max-parallel:
    description: 'Maximum number of parallel architecture builds'
    required: false
    default: '4'
  lintian-check:
    description: 'Enable Lintian checks on each built .deb'
    required: false
    default: 'false'
  telemetry-enabled:
    description: 'Enable build telemetry/metrics collection'
    required: false
    default: 'true'
  save-baseline:
    description: 'Save current build metrics as performance baseline (.telemetry/baseline.json) for regression detection'
    required: false
    default: 'false'
  pinned-metadata:
    description: 'Path to a release-metadata.json provenance pin (captured at vet time). When set and the release matches the vetted version, downloaded upstream assets are verified against the pinned SHA-256 and a mismatch fails the build.'
    required: false
    default: ''
  output-dir:
    description: 'Directory to write built .deb and .dsc source package files into'
    required: false
    default: 'dist'
  github-token:
    description: 'GitHub token for API requests (raises the anonymous rate limit). Defaults to the workflow-provided token.'
    required: false
    default: ''
  allow-unverified:
    description: 'Pass --allow-unverified to lpt build (build without checksum sidecar). Defaults to true for bash-action parity; set false for fail-closed builds.'
    required: false
    default: 'true'
  telemetry-url:
    description: 'Collector URL for the anonymous attribution ping. Empty (default) skips the ping. (vars context is unavailable inside composite actions, so this is an input, not a repo Variable.)'
    required: false
    default: ''
  lintian-suppress:
    description: 'Comma-separated lintian tags to suppress (bash-action suppress_tags parity). Empty by default.'
    required: false
    default: ''
  lx-version:
    description: 'Release tag of a prebuilt musl-static lx binary to download from the ranjithrajv/lx releases (e.g. v0.1.0, or 0.1.0). Empty (default) builds lx from source, preserving the original behavior.'
    required: false
    default: ''

outputs:
  packages:
    description: 'Space-separated list of generated .deb package filenames'
    value: ${{ steps.build.outputs.packages }}
  source-packages:
    description: 'Space-separated list of generated Debian source package (.dsc) filenames'
    value: ${{ steps.build.outputs.source-packages }}
  summary-path:
    description: 'Path to build-summary.json (package list, sizes, timing, success rate)'
    value: ${{ steps.build.outputs.summary-path }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ ! -f "${{ inputs.config-file }}" ]; then
          echo "::error::Configuration file not found: ${{ inputs.config-file }}"
          exit 1
        fi

    - name: Install lintian
      if: inputs.lintian-check == 'true'
      shell: bash
      run: |
        # lx's --lintian runs on the host (see
        # docs/decisions/2026-08-20-docker-free-lintian-source.md) -- it
        # requires a real `lintian` binary on PATH, which GitHub-hosted
        # runners don't ship by default.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends lintian

    - name: Install Rust toolchain
      if: inputs.lx-version == ''
      uses: dtolnay/rust-toolchain@stable

    - name: Cache lx build
      if: inputs.lx-version == ''
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ github.action_path }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Compute cache date
      id: cache-date
      shell: bash
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Cache lx download/API cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/lx/downloads
          ~/.cache/lx/api
        key: lx-cache-${{ github.repository }}-${{ steps.cache-date.outputs.date }}
        restore-keys: |
          lx-cache-${{ github.repository }}-

    # Resolve the directory holding the `lx` executable exactly once.
    # `lx-version` empty (default) builds lx from source, preserving the
    # original behavior; set, it downloads the matching
    # lx-<tag>-<triple>.tar.gz from the ranjithrajv/lx releases, verifies
    # the `.sha256` sidecar, and extracts it into the runner tool cache.
    # The computed `lx-bin` output is what the later steps invoke, so the
    # cargo output path is no longer hardcoded downstream.
    - name: Install lx
      id: install-lx
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LX_VERSION: ${{ inputs.lx-version }}
      run: |
        set -euo pipefail
        if [ -z "$LX_VERSION" ]; then
          # Default: build lx from source (there are no published releases
          # yet, so this path always works).
          cargo build --release --manifest-path "$ACTION_PATH/Cargo.toml"
          lx_bin="$ACTION_PATH/target/release"
        else
          # Prebuilt path: lx-<tag>-<triple>.tar.gz + .sha256, as published
          # by .github/workflows/release.yml in ranjithrajv/lx.
          case "$(uname -m)" in
            x86_64|amd64)  triple="x86_64-unknown-linux-musl" ;;
            aarch64|arm64) triple="aarch64-unknown-linux-musl" ;;
            *)
              echo "::error::no prebuilt lx for $(uname -m); leave lx-version empty to build from source"
              exit 1
              ;;
          esac
          tag="$LX_VERSION"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac
          asset="lx-${tag}-${triple}.tar.gz"
          dest="${RUNNER_TOOL_CACHE:-$HOME/.cache/lx-action}/lx/${tag}/${triple}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          (
            cd "$work"
            base="https://github.com/ranjithrajv/lx/releases/download/${tag}/${asset}"
            echo "Downloading $base"
            curl -fsSL -o "$asset" "$base"
            curl -fsSL -o "${asset}.sha256" "${base}.sha256"
            sha256sum -c "${asset}.sha256"
          )
          mkdir -p "$dest"
          tar -xzf "$work/$asset" -C "$dest"
          chmod +x "$dest/lx"
          lx_bin="$dest"
        fi
        echo "lx-bin=$lx_bin" >> "$GITHUB_OUTPUT"
        # Keep lx on PATH for parity with the build-from-source path.
        echo "$lx_bin" >> "$GITHUB_PATH"
        "$lx_bin/lx" --version

    - name: Validate version availability
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        # Fail fast on a bad `version` with recent-release suggestions
        # (bash action's pre-check parity), before the full build runs.
        # `lx validate` resolves the config against the live release and
        # lists recent tags when the requested one is missing.
        validate_flag=()
        if [ -n "${{ inputs.version }}" ]; then
          validate_flag=(--version "${{ inputs.version }}")
        fi
        "${{ steps.install-lx.outputs['lx-bin'] }}/lx" validate "${{ inputs.config-file }}" "${validate_flag[@]}"

    - name: Build packages
      id: build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        arch_flag=()
        if [ "${{ inputs.architecture }}" != "all" ]; then
          arch_flag=(--architectures "${{ inputs.architecture }}")
        fi
        lintian_flag=()
        if [ "${{ inputs.lintian-check }}" = "true" ]; then
          lintian_flag=(--lintian)
        fi
        telemetry_flag=()
        if [ "${{ inputs.telemetry-enabled }}" = "true" ]; then
          telemetry_flag=(--telemetry)
        fi
        pin_flag=()
        if [ -n "${{ inputs.pinned-metadata }}" ]; then
          if [ -f "${{ inputs.pinned-metadata }}" ]; then
            pin_flag=(--pinned-metadata "${{ inputs.pinned-metadata }}")
          else
            echo "::warning::Pinned metadata not found at ${{ inputs.pinned-metadata }}; building without provenance pin (bash-action parity)"
          fi
        fi
        baseline_flag=()
        if [ "${{ inputs.save-baseline }}" = "true" ]; then
          baseline_flag=(--save-baseline)
        fi
        unverified_flag=()
        if [ "${{ inputs.allow-unverified }}" = "true" ]; then
          unverified_flag=(--allow-unverified)
        fi
        suppress_flag=()
        if [ -n "${{ inputs.lintian-suppress }}" ]; then
          suppress_flag=(--lintian-suppress "${{ inputs.lintian-suppress }}")
        fi

        # --source: debian-multiarch-builder always generated source
        # packages alongside binary ones (no opt-in flag existed there
        # either), so this stays unconditional for drop-in parity.
        "${{ steps.install-lx.outputs['lx-bin'] }}/lx" build "${{ inputs.config-file }}" \
          --version "${{ inputs.version }}" \
          --build-version "${{ inputs.build-version }}" \
          --max-parallel "${{ inputs.max-parallel }}" \
          --output "${{ inputs.output-dir }}" \
          --source \
          --summary \
          --cache-dir "$HOME/.cache/lx/downloads" \
          --api-cache-dir "$HOME/.cache/lx/api" \
          "${arch_flag[@]}" "${lintian_flag[@]}" "${telemetry_flag[@]}" "${pin_flag[@]}" "${baseline_flag[@]}" "${unverified_flag[@]}" "${suppress_flag[@]}"

        cd "${{ inputs.output-dir }}"
        packages=$(ls -- *.deb 2>/dev/null | tr '\n' ' ' | sed 's/ *$//')
        echo "packages=$packages" >> "$GITHUB_OUTPUT"
        echo "Generated packages: $packages"

        source_packages=$(ls -- *.dsc 2>/dev/null | tr '\n' ' ' | sed 's/ *$//')
        echo "source-packages=$source_packages" >> "$GITHUB_OUTPUT"
        echo "Generated source packages: $source_packages"

        echo "summary-path=${{ inputs.output-dir }}/build-summary.json" >> "$GITHUB_OUTPUT"

    - name: Attribution telemetry ping
      if: inputs.telemetry-enabled == 'true'
      shell: bash
      env:
        LX_TELEMETRY_URL: ${{ inputs.telemetry-url }}
      run: |
        # Anonymous, opt-out via telemetry-enabled: 'false'. Sends only
        # action ref, arch, success — no repo/user/PII. Set the
        # telemetry-url input to your collector; skipped when unset.
        if [ -z "$LX_TELEMETRY_URL" ]; then exit 0; fi
        curl -sS --max-time 5 -X POST "$LX_TELEMETRY_URL" \
          -H 'Content-Type: application/json' \
          -d "{\"action\":\"${GITHUB_ACTION_REPOSITORY:-local}@${GITHUB_ACTION_REF:-dev}\",\"arch\":\"${{ inputs.architecture }}\",\"job_status\":\"${{ job.status }}\",\"runner_arch\":\"$(uname -m)\"}" || true

    - name: Upload failed build logs
      if: failure() || cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: failed-build-logs
        path: failed-build-logs/
        if-no-files-found: ignore
