[package]
name = "lx"
version = "0.1.0"
edition = "2021"
description = "lx: build (.deb/.rpm/Arch) from forge releases or source, install, and distribute Linux packages — native bare-metal builds, no containers"
license = "GPL-3.0-or-later"
repository = "https://github.com/ranjithrajv/lx"
rust-version = "1.85"

[lib]
name = "lx_lib"
path = "lib/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
reqwest = { version = "0.12", features = [
  "json",
  "blocking",
  "rustls-tls",
], default-features = false }
thiserror = "1.0"
regex = "1.10"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.10"
colored = "2.1"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
wait-timeout = "0.2"
libc = "0.2"
jiff = "0.2.35"
glob = "0.3.4"
# Interactive package.yaml generation (lx init): Input + Confirm + themes
# are core; default features (fuzzy-select etc.) are unused.
dialoguer = { version = "0.12", default-features = false }
ar = "0.9.0"
md5 = "0.8.1"
sha1 = { version = "0.10.7", features = ["oid"] }
# PKCS#1 v1.5 RSA/SHA-1 signing for Alpine apk (the `apk-rsa` Signer
# backend). Already in the tree transitively via `rpm` → `pgp`; see
# deny.toml for the accepted RUSTSEC-2023-0071 exception.
rsa = "0.9"
lzma-rust2 = { version = "0.19", default-features = false, features = [
  "encoder",
  "xz",
  "std",
] }
object = { version = "0.40.0", default-features = false, features = [
  "read",
  "elf",
  "std",
] }
rpm = "0.16"
zstd = "0.13"
# Zip extraction for the ArtifactFormat plugin (the one archive format lx
# previously only recognized). deflate only: no bzip2/aes/zstd-in-zip deps.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
percent-encoding = "2.3"
cpio = "0.4"
msix = "0.4"
xcommon = "0.3"
apple-xar = "0.20"
x509-certificate = "0.24"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
strip = true
