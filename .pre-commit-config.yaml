repos:
  - repo: local
    hooks:
      # --- pre-commit tier: fast, runs on every commit ---
      - id: cargo-fmt
        name: cargo fmt (auto-fix)
        entry: cargo fmt --all
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false

      - id: cargo-locked
        name: cargo check --locked
        # Fails if Cargo.lock is out of sync with Cargo.toml — catches
        # `cargo add` without committing the lockfile.
        entry: cargo check --locked --all-targets
        language: system
        pass_filenames: false

      - id: rust-only
        name: rust-only policy (no shell scripts)
        entry: cargo xtask policy
        language: system
        pass_filenames: false

      - id: secret-scan
        name: secret scan (staged diff)
        entry: cargo xtask secret-scan
        language: system
        pass_filenames: false

      - id: license-check
        name: license header check (GPL-3.0 SPDX)
        entry: cargo xtask license-check
        language: system
        types: [rust]
        pass_filenames: false

      - id: typos
        name: typos (spell check)
        entry: typos
        language: system
        types_or: [rust, markdown, toml, yaml]
        pass_filenames: false

      - id: taplo-fmt
        name: taplo fmt (auto-fix TOML)
        entry: taplo format
        language: system
        types: [toml]

      # --- pre-push tier: slower, needs `pre-commit install --hook-type pre-push` ---
      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: coverage-gate
        name: coverage gate (>= 40%)
        entry: cargo xtask coverage
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-deny
        name: cargo deny (licenses + advisories + bans)
        # Replaces cargo-audit with a richer policy: license compliance,
        # duplicate crate detection, and explicit crate bans. Config in
        # deny.toml.
        entry: cargo deny --all-features check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-doc
        name: cargo doc (deny warnings)
        # Catches broken intra-doc links, missing docs, and rustdoc
        # warnings before they hit CI/docs.rs. RUSTDOCFLAGS is set
        # inline because pre-commit doesn't inherit shell env.
        entry: bash -c 'RUSTDOCFLAGS="--deny warnings" cargo doc --no-deps --all-features'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: markdownlint
        name: markdownlint (docs lint)
        entry: markdownlint
        language: system
        types: [markdown]
        pass_filenames: false
        stages: [pre-push]
